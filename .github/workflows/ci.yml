name: SignalLoop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
      - run: npm run check
      - run: npm test
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser-smoke.py
        env:
          BROWSER_ARTIFACTS: /tmp/signalloop-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: /tmp/signalloop-browser
          if-no-files-found: ignore
          retention-days: 7
